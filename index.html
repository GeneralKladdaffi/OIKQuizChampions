<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a1a10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="QuizChampions"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>QuizChampions 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --px:"Press Start 2P",ui-monospace,Menlo,monospace; --pxb:"Pixelify Sans",ui-monospace,Menlo,monospace;
  --bg:#0a1a10; --bg2:#10291a; --panel:#081a10ee; --cream:#fff6e0; --soft:#c9e8d2; --ink:#1d1838;
  --sun:#ffd23f; --mint:#4be0a0; --coral:#ff6b6b; --violet:#b98bff; --sky:#5cc8ff; --line:#2f6b45;
  --pxbtn:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,7px 7px 0 3px #000;
  --pxbtn-dn:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--cream);font-family:var(--pxb);font-size:17px;line-height:1.35;-webkit-font-smoothing:none;
  background:linear-gradient(180deg,#0a1a10 0 16%,#0d2215 16% 32%,#10291a 32% 48%,#14301f 48% 64%,#173822 64% 80%,#1b4026 80%);background-attachment:fixed}
body[data-r="kick"]{background-image:linear-gradient(180deg,#0c1840 0 16%,#10204e 16% 32%,#14295c 32% 48%,#18336a 48% 64%,#1d3e78 64% 80%,#234a86 80%)}
body[data-r="lakt"]{background-image:linear-gradient(180deg,#2a0608 0 16%,#3a090c 16% 32%,#4a0d11 32% 48%,#5b1116 48% 64%,#6c161b 64% 80%,#7e1b21 80%)}
body[data-r="vem"]{background-image:linear-gradient(180deg,#1a0f3a 0 16%,#221448 16% 32%,#2b1a56 32% 48%,#352065 48% 64%,#3f2774 64% 80%,#4a2e83 80%)}
body[data-r="vart"]{background-image:linear-gradient(180deg,#2a0c26 0 16%,#381031 16% 32%,#46143b 32% 48%,#561946 48% 64%,#671f50 64% 80%,#78265a 80%)}
body[data-r="off"]{background-image:linear-gradient(180deg,#062a2e 0 16%,#08343a 16% 32%,#0b3f45 32% 48%,#0e4a50 48% 64%,#12565b 64% 80%,#166266 80%)}
body[data-r="guld"]{background-image:linear-gradient(180deg,#221a04 0 16%,#2e2306 16% 32%,#3b2d08 32% 48%,#48380b 48% 64%,#56430e 64% 80%,#644f11 80%)}
body[data-r="vm"]{background-image:linear-gradient(180deg,#2a1208 0 16%,#38180b 16% 32%,#461f0f 32% 48%,#552713 48% 64%,#652f17 64% 80%,#75381c 80%)}
body[data-r="trivia"]{background-image:linear-gradient(180deg,#081a24 0 16%,#0b2330 16% 32%,#0f2d3c 32% 48%,#133748 48% 64%,#184255 64% 80%,#1d4d62 80%)}
body[data-r="straff"]{background-image:linear-gradient(180deg,#04221a 0 16%,#062e22 16% 32%,#083a2b 32% 48%,#0a4734 48% 64%,#0d543e 64% 80%,#106248 80%)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:56px;z-index:-1;background:repeating-linear-gradient(90deg,#1e7a3a 0 32px,#23893f 32px 64px);border-top:4px solid var(--cream);box-shadow:0 -4px 0 #000}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--px);font-weight:400;margin:0;letter-spacing:0}
.eyebrow{font-family:var(--px);font-size:8px;line-height:1.8;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--soft)}
.panel{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px var(--line),6px 6px 0 #000;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:13px;line-height:1.6;color:var(--sun);text-shadow:2px 2px 0 #000}
.panel p{margin:0}
.btn{font-family:var(--px);font-size:10px;line-height:1.5;border:0;background:var(--cream);color:var(--ink);padding:12px 14px;margin:4px;box-shadow:var(--pxbtn);cursor:pointer;text-align:center}
.btn.small{font-size:8px;padding:8px 9px}
.btn.primary{background:var(--sun)} .btn.star{background:var(--violet)} .btn.red{background:var(--coral)}
.btn:active:not(:disabled){transform:translate(4px,4px);box-shadow:var(--pxbtn-dn)}
.btn:disabled{background:#3a4a40;color:#8aa596;box-shadow:var(--pxbtn-dn);cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.input{width:100%;border:4px solid #000;background:var(--cream);color:var(--ink);font-family:var(--pxb);font-size:20px;padding:10px 12px;box-shadow:inset 3px 3px 0 #d9c9a0}
.input:focus{outline:4px solid var(--sun);outline-offset:0}
.input.code{font-family:var(--px);font-size:20px;text-transform:uppercase;letter-spacing:.15em}
label.lab{font-family:var(--px);font-size:8px;color:var(--soft)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;font-family:var(--px);font-size:10px;line-height:1.7;background:var(--sun);color:var(--ink);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:10px 14px;max-width:90vw;text-align:center}
.net{font-family:var(--px);font-size:8px;display:inline-flex;align-items:center;gap:6px}
.net i{width:10px;height:10px;background:var(--coral);border:2px solid #000;display:inline-block}
.net.on i{background:var(--mint)}
.pxlogo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;font-family:var(--px);line-height:1.3}
.pxlogo .l1{font-size:12px;color:var(--cream);text-shadow:2px 2px 0 #000;letter-spacing:.12em}
.pxlogo .l2{font-size:clamp(20px,7vw,30px);color:var(--sun);text-shadow:3px 3px 0 #b8241c,6px 6px 0 #000}
.pxlogo .l3{font-size:11px;color:var(--mint);text-shadow:2px 2px 0 #000}
.pxball{width:44px;height:44px;animation:pxbounce .9s steps(3) infinite}
@keyframes pxbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bar{height:14px;border:3px solid #000;background:#0008;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--sun) 0 8px,#d9a810 8px 10px)}
.bar.low i{background:repeating-linear-gradient(90deg,var(--coral) 0 8px,#c94040 8px 10px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--cream);color:var(--ink);border:3px solid #000;padding:2px 8px;font-size:15px;font-weight:600}
.chips span.me{background:var(--sun)}
.tname{font-family:var(--px);font-size:14px;line-height:1.5;color:var(--sun);text-shadow:2px 2px 0 #000;overflow-wrap:anywhere}
.big{font-family:var(--px);font-size:48px;color:var(--sun);text-shadow:5px 5px 0 #000;text-align:center;line-height:1.2}

/* ============ SPELARE ============ */
#player{max-width:560px;margin:0 auto;padding:12px 14px 90px;display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--px);font-size:8px;line-height:1.7}
.ptop b{font-weight:400;color:var(--sun)}
.qtext{font-size:20px;line-height:1.35;font-weight:600}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;flex-direction:column;gap:6px;text-align:left;font-family:var(--pxb);font-size:18px;font-weight:600;background:var(--cream);color:var(--ink);border:4px solid #000;box-shadow:4px 4px 0 #000;padding:12px;cursor:pointer;width:100%}
.opt .who{font-size:14px;font-weight:400;color:#4a4368}
.opt .act{font-family:var(--px);font-size:8px;align-self:flex-start;background:var(--sun);border:3px solid #000;padding:5px 7px}
.opt.mine{background:#ffe891} .opt.mine .act{background:var(--mint)}
.opt.locked{background:var(--mint)} .opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.res{font-family:var(--px);font-size:22px;line-height:1.4;text-shadow:3px 3px 0 #000;text-align:center}
.res.ok{color:var(--mint)} .res.no{color:var(--coral)}
.stand{display:flex;flex-direction:column;gap:8px}
.stand div{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--cream);color:var(--ink);border:4px solid #000;box-shadow:4px 4px 0 #000;padding:8px 12px;font-weight:600}
.stand div.me{background:var(--sun)}
.stand b{font-family:var(--px);font-size:13px;font-weight:400}
.gwrap iframe{display:block;width:100%;height:120vw;max-height:820px;border:0;background:transparent}
.gbmodal{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.gbbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:4px solid #000;font-family:var(--px);font-size:12px;color:var(--sun)}
#gbFree{flex:1;width:100%;border:0;background:transparent}
.install b{color:var(--sun)}

/* ============ VÄRD (storbild) ============ */
#host{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:14px 22px 76px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.htop .logo{font-family:var(--px);font-size:16px;color:var(--sun);text-shadow:3px 3px 0 #000;line-height:1.4}
.htop .logo small{display:block;font-size:9px;color:var(--cream)}
.htop .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.codechip{font-family:var(--px);font-size:12px;background:var(--sun);color:var(--ink);border:4px solid #000;box-shadow:4px 4px 0 #000;padding:8px 10px}
.stage{display:grid;grid-template-columns:minmax(260px,34%) 1fr;gap:22px;align-items:stretch;min-height:0}
.presbox{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:420px}
.pres{position:relative;width:100%;max-width:420px;aspect-ratio:540/880;display:flex;align-items:flex-end;justify-content:center}
.pres img,.pres canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(8px 8px 0 #000)}
.pres.talk img{animation:bob .5s steps(2) infinite}
.pres.cheer img{animation:jump .6s steps(3) infinite}
.pres.angry img{animation:lean 1.6s steps(8) forwards}
.pres.dance img{animation:dance .9s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes jump{50%{transform:translateY(-18px)}}
@keyframes lean{0%{transform:scale(1)}60%{transform:scale(1.18) translateY(20px)}70%{transform:scale(1.18) translate(-4px,20px)}80%{transform:scale(1.18) translate(4px,20px)}100%{transform:scale(1.2) translateY(22px)}}
@keyframes dance{25%{transform:rotate(-3deg) translateY(-6px)}75%{transform:rotate(3deg) translateY(-6px)}}
.pres .noimg{font-family:var(--px);font-size:10px;color:var(--soft);text-align:center;align-self:center;line-height:1.8}
.bubble{position:absolute;left:2%;right:2%;bottom:3%;z-index:2;background:var(--cream);color:var(--ink);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:14px 16px;font-size:clamp(17px,1.6vw,26px);font-weight:600;line-height:1.3;max-height:42%;overflow:hidden}
.bubble::after{content:"";position:absolute;top:-20px;left:46%;border:10px solid transparent;border-bottom-color:#000;border-left-color:#000}
.bubble:empty{display:none}
.board{display:flex;flex-direction:column;gap:16px;min-width:0}
.board .round{font-family:var(--px);font-size:clamp(14px,1.5vw,22px);color:var(--cream);text-shadow:3px 3px 0 #000}
.board .round b{color:var(--sun);font-weight:400}
.hq{font-size:clamp(26px,2.8vw,46px);line-height:1.25;font-weight:700;text-shadow:3px 3px 0 #000}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hopt{background:var(--cream);color:var(--ink);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:16px;font-size:clamp(20px,2vw,32px);font-weight:700;display:flex;gap:12px;align-items:center}
.hopt b{font-family:var(--px);font-weight:400;font-size:.7em;background:var(--sun);border:3px solid #000;padding:6px 8px}
.hopt.right{background:var(--mint)} .hopt.wrong{opacity:.4}
.hcount{font-family:var(--px);font-size:min(30vh,220px);color:var(--sun);text-shadow:10px 10px 0 #000;text-align:center;line-height:1;margin:auto}
.teamrow{display:flex;flex-wrap:wrap;gap:12px}
.tbox{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px var(--line),5px 5px 0 #000;padding:10px 14px;min-width:170px;display:flex;flex-direction:column;gap:4px}
.tbox .n{font-family:var(--px);font-size:11px;line-height:1.5;color:var(--sun)}
.tbox .s{font-family:var(--px);font-size:22px;color:var(--cream)}
.tbox .st{font-size:16px}
.tbox.lock{box-shadow:inset 0 0 0 3px var(--mint),5px 5px 0 #000}
.tbox.ok{background:#0b4a2a} .tbox.no{background:#4a0d11}
.pens{font-family:var(--px);font-size:16px;letter-spacing:4px}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.qr{background:var(--cream);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:10px;width:250px;height:250px}
.qr svg,.qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.hcode{font-family:var(--px);font-size:clamp(40px,5vw,72px);color:var(--sun);text-shadow:6px 6px 0 #000;letter-spacing:.12em}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.plist span{background:var(--cream);color:var(--ink);border:3px solid #000;padding:4px 10px;font-weight:700;font-size:20px}
.stand.h div{font-size:clamp(20px,2vw,30px);padding:12px 16px}
.stand.h b{font-size:clamp(14px,1.4vw,22px)}
.nowplay{font-family:var(--px);font-size:11px;color:var(--soft);line-height:1.7}
.setup{display:flex;flex-direction:column;gap:10px}
select.input{font-size:16px}
@media (max-width:900px){ .stage{grid-template-columns:1fr} .presbox{min-height:300px} .lobby{grid-template-columns:1fr} .hopts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .pres img,.pxball{animation:none!important} }

</style></head><body>
<div id="host" hidden>
  <div class="htop">
    <div class="logo">QuizChampions 2026<small>Obbola IK · värd</small></div>
    <div class="ctl">
      <span class="codechip" id="hCode">KOD</span>
      <span class="net"><i></i><span>Ansluter …</span></span>
      <button class="btn small primary" id="hResume" hidden>▶ Fortsätt</button>
      <button class="btn small" id="hPauseBtn" hidden>❚❚ Paus</button>
      <button class="btn small" id="hRedoBtn" hidden title="Kör om det här steget">↺ Igen</button>
      <button class="btn small" id="hSkipBtn" hidden>Hoppa ▶▶</button>
      <button class="btn small" id="hFull">Helskärm</button>
      <button class="btn small red" id="hNewBtn" hidden>Avsluta</button>
    </div>
  </div>
  <div class="stage">
    <div class="presbox">
      <div class="pres idle" id="hPres"><div class="bubble" id="hSay"></div><img id="hPresImg" alt="Quizvärden"><div class="noimg" id="hPresNo" hidden>Lägg mappen<br>quiz animation<br>bredvid filen</div></div>
    </div>
    <div class="board" id="hBoard"></div>
  </div>
</div>

<div id="player" hidden>
  <div class="ptop" id="pTop"></div>
  <div id="pView"></div>
  <div id="pGames" hidden>
    <div class="gwrap" id="kbWrap" hidden><iframe id="kbFrame" title="Kick Beat" scrolling="no"></iframe></div>
    <div class="gwrap" id="gbWrap" hidden><iframe id="gbFrame" title="Guldboll" scrolling="no"></iframe></div>
  </div>
</div>
<div class="gbmodal" id="gbModal" hidden><div class="gbbar"><b>GULDBOLL</b><button class="btn small" id="gbClose" type="button">STÄNG</button></div><iframe id="gbFree" title="Guldboll"></iframe></div>

  const c=mqtt.connect(brokerUrl(bi),{clientId:"qc"+rid(10), clean:true, reconnectPeriod:2000, connectTimeout:9000, keepalive:20});

  c.on("close",()=>onStatus&&onStatus(false)); c.on("offline",()=>onStatus&&onStatus(false)); c.on("error",()=>{});

let H=null, HNET=null, pubTimer=0, runTok=0, clipT=[], curEl=null, VOICE=null, hTick=0;
const PRES={talk:"quiz%20animation/narrator_1_pratar.gif", cheer:"quiz%20animation/narrator_2_armarna_upp.gif", angry:"quiz%20animation/narrator_3_arg_mot_kameran.gif"};
const CODECH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function genCode(){ let s=""; for(let i=0;i<4;i++) s+=CODECH[Math.floor(Math.random()*CODECH.length)]; return s; }
function freshH(){ return {code:genCode(), bi:0, players:{}, teams:[], drawn:false, nteams:0, si:-1, deadline:0, phStart:0, votes:{}, locked:{}, res:{}, game:{}, gres:{}, pens:{}, say:"", mood:"idle", paused:false}; }
function saveH(){ LS.set("qc_host",H); }
function fullCode(){ return H.code+(H.bi?"-"+(H.bi+1):""); }
function joinUrl(){ let u=APP_URL+"?g="+fullCode(); if(QS.get("broker")) u+="&broker="+encodeURIComponent(QS.get("broker")); if(QS.get("app")) u=QS.get("app")+"?g="+fullCode()+(QS.get("broker")?"&broker="+encodeURIComponent(QS.get("broker")):""); return u; }

/* ---------- nät ---------- */
function hostConnect(){ if(HNET){ try{ HNET.end(true); }catch(e){} }
  HNET=netConnect(H.bi,[topic(H.code,"a")],(t,d)=>onAct(d),on=>{ setNet(on); if(on) pub(true); }); }
function pub(now){ clearTimeout(pubTimer); const go=()=>{ if(HNET && HNET.connected) HNET.publish(topic(H.code,"s"),JSON.stringify(pubState()),{qos:1,retain:true}); };
  if(now) go(); else pubTimer=setTimeout(go,120); }
function pubState(){ const st=stepAt(H.si), Q=qOf(st), R=st&&st.r!=null?PROGRAM[st.r]:null;
  const players={}; Object.entries(H.players).forEach(([pid,p])=>players[pid]=p.name);
  return {v:2, code:H.code, si:H.si, k:st?st.k:"lobby", drawn:H.drawn, r:st?st.r:null, rid:R?R.id:null, title:R?R.title:null, short:R?R.short:null, intro:R?R.intro:null,
    type:Q?Q.type:null, text:Q?Q.q:null, opts:Q&&Q.opts?Q.opts:null, pen:Q?Q.pen||0:0, dur:Q?Q.dur||0:0, deadline:H.deadline, start:H.phStart, paused:H.paused,
    teams:H.teams.map(t=>({id:t.id,name:t.name,members:t.members,score:t.score})), players, votes:H.votes, locked:H.locked,
    reveal: st&&st.k==="reveal" ? {a:Q.a, res:H.res[H.si]||{}} : null, gres: st&&st.k==="gameres" ? (H.gres[H.si]||{}) : null,
    pens:H.pens, say:H.say, qn:qNum(st), qt:QTOTAL, now:Date.now()}; }
const QTOTAL=PROGRAM.reduce((n,R)=>n+R.qs.length,0);
function qNum(st){ if(!st||st.q==null) return 0; let n=0; for(let r=0;r<st.r;r++) n+=PROGRAM[r].qs.length; return n+st.q+1; }

/* ---------- spelare och lag ---------- */
function onAct(d){ if(!d||!d.pid||typeof d.pid!=="string") return; const pid=d.pid.slice(0,20); let p=H.players[pid];
  if(d.t==="join"){ const name=String(d.name||"").replace(/\s+/g," ").trim().slice(0,16); if(!name) return;
    if(!p){ p=H.players[pid]={name, team:null}; if(H.drawn) assignLate(pid); if(H.si<0 && Object.keys(H.players).length%4===0 && !speakingNow) say(rnd(LINES.lobby),"angry"); }
    else p.name=name;
    saveH(); pub(); renderHost(); return; }
  if(!p) return;
  if(d.t==="vote"){ const st=stepAt(H.si); if(!st||st.k!=="play"||d.si!==H.si) return; const tid=p.team; if(tid==null||H.locked[tid]!=null) return;
    const Q=qOf(st), o=d.opt; const tv=H.votes[tid]||(H.votes[tid]={});
    if(o==null || !(o>=0 && o<Q.opts.length) || (tv[pid] && tv[pid].o===o)) delete tv[pid]; else tv[pid]={o, t:Date.now()};
    checkLock(tid); pub(); renderHost(); return; }
  if(d.t==="name"){ const tm=H.teams.find(t=>t.id===p.team); const n=String(d.name||"").replace(/\s+/g," ").trim().slice(0,24); if(tm && n){ tm.name=n; saveH(); pub(); renderHost(); } return; }
  if(d.t==="game"){ const si=d.si|0, st=stepAt(si); if(!st||st.k!=="game") return; (H.game[si]=H.game[si]||{})[pid]={score:Math.max(0,Math.min(999,d.score|0))};
    if(H.si===si+1 && stepAt(H.si).k==="gameres") computeGres(H.si); renderHostLive(); saveH(); return; }
}
function teamOf(pid){ return H.teams.find(t=>t.members.includes(pid)); }
function autoK(n){ let k=Math.max(1,Math.ceil(n/5)); while(k>1 && n/k<3) k--; return k; }
function drawTeams(){ const pids=Object.keys(H.players); if(!pids.length){ toast("Inga spelare inne än"); return; }
  const k=H.nteams||autoK(pids.length); for(let i=pids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pids[i],pids[j]]=[pids[j],pids[i]]; }
  const names=TEAMNAMES.slice().sort(()=>Math.random()-.5);
  H.teams=Array.from({length:k},(_,i)=>({id:"t"+i, name:names[i], members:[], score:0}));
  pids.forEach((pid,i)=>{ const t=H.teams[i%k]; t.members.push(pid); H.players[pid].team=t.id; });
  H.drawn=true; H.pens={}; saveH(); pub(); renderHost(); say(LINES.teams,"cheer"); }
function assignLate(pid){ if(!H.teams.length) return; const t=H.teams.slice().sort((a,b)=>a.members.length-b.members.length)[0]; t.members.push(pid); H.players[pid].team=t.id; }

      <div class="eyebrow">Skanna eller öppna appen och skriv koden</div><div class="hcode">${esc(fullCode())}</div><div class="nowplay">${esc(APP_URL.replace("https://",""))}</div>
      <div class="eyebrow">Inloggade spelare: ${ps.length}${H.drawn?" (klicka för att ta bort)":" (klicka för att ta bort)"}</div>
      <div class="plist" id="hPlist">${ps.map(([pid,p])=>`<span data-pid="${esc(pid)}" title="Ta bort">${esc(p.name)}</span>`).join("")||'<span style="opacity:.5">Inga än …</span>'}</div>
      ${teams}
      <div class="row"><label class="lab" for="hK">Antal lag</label><select class="input" id="hK" style="width:auto">${[0,1,2,3,4,5,6].map(k=>`<option value="${k}" ${H.nteams===k?"selected":""}>${k?k+" lag":"Auto (3–5 per lag)"}</option>`).join("")}</select>
        <button class="btn primary" id="hDraw">${H.drawn?"Lotta om lagen":"Lotta lagen"}</button>
        <button class="btn star" id="hStart" ${H.drawn&&activeTeams().length?"":"disabled"}>Starta quizet ▶</button></div>
      <details class="panel setup"><summary class="eyebrow" style="cursor:pointer">Inställningar: röst, ljud och server</summary>
        <div class="muted" id="hSongs">${esc(songStatus())}</div>
        <div class="row"><label class="lab" for="hVoice">Röst</label><select class="input" id="hVoice" style="width:auto">${vs.length?vs.map(v=>`<option ${VOICE&&VOICE.name===v.name?"selected":""}>${esc(v.name)}</option>`).join(""):"<option>Ingen svensk röst hittades</option>"}</select>
          <label class="lab" for="hRate">Tempo</label><select class="input" id="hRate" style="width:auto">${[0.9,1,1.05,1.1,1.2].map(r=>`<option value="${r}" ${LS.get("qc_rate",1.05)==r?"selected":""}>${r}</option>`).join("")}</select>
          <button class="btn small" id="hTestV">Testa rösten</button><button class="btn small" id="hTestA">Testa ljudet</button></div>
        <div class="row"><label class="lab" for="hBi">Server</label><select class="input" id="hBi" style="width:auto">${BROKERS.map((u,i)=>`<option value="${i}" ${H.bi===i?"selected":""}>${i+1}: ${esc(u.split("/")[2].split(":")[0])}</option>`).join("")}</select>
          <span class="muted">Byt bara om spelarna inte kommer in. Koden ändras då.</span></div>
        <div class="row"><button class="btn small red" id="hReset">Nytt quiz (ny kod, rensa allt)</button></div>
      </details></div></div>`; }
function bindLobby(){ $("hPlist").onclick=e=>{ const s=e.target.closest("[data-pid]"); if(s) removePlayer(s.dataset.pid); };
  $("hK").onchange=e=>{ H.nteams=+e.target.value; saveH(); };
  $("hDraw").onclick=()=>{ drawTeams(); };
  $("hStart").onclick=()=>{ primeAudio(); speak(""); runStep(0); };
  $("hVoice").onchange=e=>{ LS.set("qc_voice",e.target.value); pickVoice(); };
  $("hRate").onchange=e=>{ LS.set("qc_rate",+e.target.value); };
  $("hTestV").onclick=()=>{ say("Hej! Jag är er quizvärd ikväll. Det här kommer att gå bra. För mig.","cheer"); };
  $("hTestA").onclick=()=>{ primeAudio(); const c=allClips()[0]; const el=H_els[tkey(c)]; if(!el){ toast("Låtarna är inte hämtade än"); return; } el.currentTime=0; el.play(); curEl=el; setTimeout(()=>{ el.pause(); },5000); };
  $("hBi").onchange=e=>{ H.bi=+e.target.value; saveH(); hostConnect(); renderHost(); };
  $("hReset").onclick=e=>{ if(e.target.dataset.sure!=="1"){ e.target.dataset.sure="1"; e.target.textContent="Säker? Tryck igen"; return; } newQuiz(); }; }
function newQuiz(){ runTok++; stopAudio(); stopSpeak(); if(HNET && HNET.connected) HNET.publish(topic(H.code,"s"),"",{retain:true,qos:1}); H=freshH(); saveH(); document.body.dataset.r=""; hostConnect(); renderHost(); }

function initHost(){ $("host").hidden=false; document.title="Värd · QuizChampions 2026";
  const saved=LS.get("qc_host",null); H = saved && saved.code ? saved : freshH(); H.paused=false; if(!H.res) H.res={}; if(!H.gres) H.gres={}; if(!H.game) H.game={}; if(!H.pens) H.pens={};
  pickVoice(); setupPres(); hostConnect(); loadSongs();
  $("hPauseBtn").onclick=togglePause; $("hSkipBtn").onclick=skip; $("hRedoBtn").onclick=redo;
  $("hNewBtn").onclick=e=>{ if(e.target.dataset.sure!=="1"){ e.target.dataset.sure="1"; e.target.textContent="Säker?"; setTimeout(()=>{ e.target.dataset.sure=""; e.target.textContent="Avsluta"; },3000); return; } newQuiz(); };
  $("hFull").onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); };
  if(H.si>=0){ const resume=H.si; H.si=-1; $("hResume").hidden=false; $("hResume").textContent=`▶ Fortsätt quizet (steg ${resume})`; $("hResume").onclick=()=>{ $("hResume").hidden=true; primeAudio(); runStep(resume); }; }
  renderHost(); setInterval(hostTicker,200); }

/* ================= SPELARE ================= */
let ME=LS.get("qc_me",null), ST=null, PNET=null, joinedAt=0, lastRenderKey="", game={si:-1, kind:null, score:0, sentAt:0, sent:-1};
function myTeam(){ if(!ST||!ME) return null; return (ST.teams||[]).find(t=>t.members.includes(ME.pid))||null; }
function pname(pid){ return (ST&&ST.players&&ST.players[pid])||"?"; }
function send(o){ if(PNET && PNET.connected && ME) PNET.publish(topic(ME.code,"a"),JSON.stringify(Object.assign({pid:ME.pid},o)),{qos:1}); }
function playerConnect(){ if(PNET){ try{ PNET.end(true); }catch(e){} } ST=null;
  PNET=netConnect(ME.bi,[topic(ME.code,"s")],(t,d)=>{ if(!d||d.v!==2) return; const prevK=ST&&ST.k, prevSi=ST&&ST.si; ST=d; onState(prevK,prevSi); },
    on=>{ setNet(on); if(on){ send({t:"join",name:ME.name}); joinedAt=Date.now(); } renderPlayer(); }); }
function onState(prevK,prevSi){
  if(ME && ST.players && !ST.players[ME.pid] && Date.now()-joinedAt>3000){ joinedAt=Date.now(); send({t:"join",name:ME.name}); }
  // spel på telefonen
  const inGame = ST.k==="game" && !ST.paused;
  if(game.si>=0 && (ST.si!==game.si)) stopGame();
  if(ST.k==="game" && game.si!==ST.si && myTeam()) startGame();
  document.body.dataset.r=ST.rid||"";
  renderPlayer(); }

/* ---------- spelen ---------- */
const GAMESRC={};
function frame(kind){ return kind==="kick"?$("kbFrame"):$("gbFrame"); }
function ensureFrame(kind,cb){ const f=frame(kind); if(f.dataset.ready==="1"){ cb(); return; }
  if(f.dataset.loading==="1"){ f.addEventListener("load",()=>setTimeout(cb,40),{once:true}); return; }
  f.dataset.loading="1"; f.addEventListener("load",()=>{ f.dataset.ready="1"; setTimeout(cb,40); },{once:true}); f.srcdoc=b64html(kind==="kick"?KB_SRC:GB_SRC); }
function startGame(){ const kind=ST.type==="kick"?"kick":"guld"; game={si:ST.si, kind, score:0, sentAt:0, sent:-1};
  $("pGames").hidden=false; $("kbWrap").hidden=kind!=="kick"; $("gbWrap").hidden=kind!=="guld";
  ensureFrame(kind,()=>{ if(game.si!==ST.si) return; const el=Math.max(0,(Date.now()-ST.start)/1000); const f=frame(kind);
    f.contentWindow.postMessage(kind==="kick"?{cmd:"start",elapsed:el,bpm:124}:{cmd:"start",elapsed:el,dur:ST.dur||120},"*"); }); }
function stopGame(){ if(game.si<0) return; const f=frame(game.kind); try{ f.contentWindow.postMessage({cmd:"stop"},"*"); }catch(e){} reportGame(true); game.si=-1; $("pGames").hidden=true; }
function reportGame(force){ if(game.si<0) return; const now=Date.now(); if(!force && now-game.sentAt<1500) return; if(game.sent===game.score && !force) return; game.sentAt=now; game.sent=game.score; send({t:"game",si:game.si,score:game.score}); }
addEventListener("message",e=>{ const m=e.data||{}; const kb=$("kbFrame"), gb=$("gbFrame");
  if(e.source===kb.contentWindow){ if(m.kbh) kb.style.height=m.kbh+"px"; if(m.kb && game.kind==="kick" && game.si>=0){ game.score=Math.max(0,m.notes|0); reportGame(!!m.out); } }
  if(e.source===gb.contentWindow){ if(m.gbh) gb.style.height=m.gbh+"px"; if(m.gb && game.kind==="guld" && game.si>=0){ game.score=Math.max(0,m.goals|0); reportGame(!!(m.out||m.done)); } } });
setInterval(()=>reportGame(false),1600);

/* ---------- rita ---------- */
function teamCard(t){ return `<div class="panel"><div class="eyebrow">Ditt lag</div><div class="tname">${esc(t.name)}</div><div class="chips">${t.members.map(p=>`<span class="${p===ME.pid?"me":""}">${esc(pname(p))}</span>`).join("")}</div></div>`; }
function standHtml(){ const s=(ST.teams||[]).filter(t=>t.members.length).slice().sort((a,b)=>b.score-a.score); const mt=myTeam();
  return `<div class="stand">${s.map((t,i)=>`<div class="${mt&&t.id===mt.id?"me":""}"><span>${i+1}. ${esc(t.name)}</span><b>${t.score} p</b></div>`).join("")}</div>`; }
function voteOpts(){ const mt=myTeam(); if(!mt) return ""; const tv=(ST.votes||{})[mt.id]||{}, locked=(ST.locked||{})[mt.id], need=Math.floor(mt.members.length/2)+1;
  return `<div class="opts">${ST.opts.map((o,i)=>{ const vs=Object.entries(tv).filter(([p,v])=>v.o===i).sort((a,b)=>a[1].t-b[1].t).map(([p])=>p); const mine=tv[ME.pid]&&tv[ME.pid].o===i;
    let act, cls="opt"; if(locked!=null){ act = i===locked?"LÅST ✓":""; cls+= i===locked?" locked":" dim"; }
    else if(mine){ act=`DIN RÖST ✓ ${vs.length}/${need}`; cls+=" mine"; } else if(vs.length){ act=`GODKÄNN ${vs.length}/${need}`; } else act="FÖRESLÅ";
    const who = vs.length ? `${esc(pname(vs[0]))} föreslår${vs.length>1?` · ${vs.slice(1).map(p=>esc(pname(p))).join(", ")} godkänner`:""}` : "";
    return `<button class="${cls}" data-o="${i}" ${locked!=null?"disabled":""}><span>${esc(o)}</span>${who?`<span class="who">${who}</span>`:""}${act?`<span class="act">${act}</span>`:""}</button>`; }).join("")}</div>`; }
function renderPlayer(){ const v=$("pView"), top=$("pTop");
  if(!ME){ top.innerHTML=""; v.innerHTML=loginHtml(); bindLogin(); return; }
  const mt=ST?myTeam():null;
  top.innerHTML=`<span>${esc(ME.name)}${mt?` · <b>${esc(mt.name)}</b>`:""}</span><span class="net ${PNET&&PNET.connected?"on":""}"><i></i><span>${PNET&&PNET.connected?"Uppkopplad":"Ansluter …"}</span></span>`;
  if(document.activeElement && document.activeElement.id==="pRename") return;
  if(!ST){ v.innerHTML=`<div class="panel"><h2>Ansluter till quiz ${esc(ME.code)} …</h2><p class="muted">Kontrollera att du har internet. Har värden inte startat än? Vänta en stund.</p><div class="row"><button class="btn small" id="pOut">Byt namn eller kod</button></div></div>`; $("pOut").onclick=logout; return; }
  if(!ST.players[ME.pid]){ v.innerHTML=`<div class="panel"><h2>Loggar in …</h2><p class="muted">Väntar på värden.</p><div class="row"><button class="btn small" id="pOut">Byt namn eller kod</button></div></div>`; $("pOut").onclick=logout; return; }
  const head = ST.title ? `<div class="eyebrow">${esc(ST.short)} · ${esc(ST.title)}${ST.qn?` · Fråga ${ST.qn} av ${ST.qt}`:""}</div>` : "";
  let h="";
  if(ST.paused) h+=`<div class="panel"><h2>Paus</h2><p class="muted">Värden har pausat quizet.</p></div>`;
  if(ST.k==="lobby"){
    if(!ST.drawn) h+=`<div class="panel">${LOGO}<h2>Hej ${esc(ME.name)}! Du är inne.</h2><p>Väntar på att värden lottar lagen. ${Object.keys(ST.players).length} spelare inloggade.</p><div class="chips">${Object.values(ST.players).map(n=>`<span>${esc(n)}</span>`).join("")}</div><div class="row"><button class="btn star small" id="pGb">Värm upp: spela Guldboll</button><button class="btn small" id="pOut">Byt namn</button></div></div>`;
    else if(mt) h+=`${teamCard(mt)}<div class="panel"><h2>Döp ert lag</h2><p class="muted">Vem som helst i laget kan ändra namnet innan quizet startar.</p><input class="input" id="pRename" maxlength="24" value="${esc(mt.name)}" autocomplete="off"><div class="row"><button class="btn primary" id="pRenameBtn">Spara namnet</button><button class="btn star small" id="pGb">Spela Guldboll</button></div></div>`;
    else h+=`<div class="panel"><h2>Du placeras i ett lag …</h2></div>`; }
  else if(!mt){ h+=`<div class="panel"><h2>Du placeras i ett lag …</h2><p class="muted">Värden lägger in dig i det minsta laget.</p></div>`; }
  else if(ST.k==="welcome") h+=`${teamCard(mt)}<div class="panel">${LOGO}<h2>Lyssna på värden!</h2></div>`;
  else if(ST.k==="round") h+=`<div class="panel">${head}<h2>${esc(ST.title)}</h2><p>${esc(ST.intro)}</p></div>`;
  else if(ST.k==="ask") h+=`<div class="panel">${head}<div class="qtext">${esc(ST.text)}</div>${ST.opts?`<div class="opts">${ST.opts.map(o=>`<button class="opt dim" disabled><span>${esc(o)}</span></button>`).join("")}</div>`:""}<p class="muted">Lyssna på frågan …</p></div>`;
  else if(ST.k==="count") h+=`<div class="panel">${head}<div class="big" id="pCount">3</div><p class="muted" style="text-align:center">${ST.type==="choice"?"Gör er redo att svara!":"Gör dig redo att spela!"}</p></div>`;
  else if(ST.k==="play") h+=`<div class="panel">${head}<div class="qtext">${esc(ST.text)}</div><div class="bar" id="pBar"><i style="width:100%"></i></div>${voteOpts()}<p class="muted">Tryck för att föreslå eller godkänna. Mer än halva laget måste godkänna samma svar.</p></div>`;
  else if(ST.k==="reveal"){ const r=(ST.reveal&&ST.reveal.res||{})[mt.id]; const ok=r&&r.ok;
    h+=`<div class="panel">${head}<div class="res ${ok?"ok":"no"}">${r&&r.ans==null?"INGET SVAR":ok?(ST.pen?"MÅL! +1":"RÄTT! +1"):(ST.pen?"RÄDDAD!":"FEL!")}</div><p>Rätt svar: <b>${esc(ST.opts[ST.reveal.a])}</b></p>${r&&r.ans!=null&&!ok?`<p class="muted">Ni svarade: ${esc(ST.opts[r.ans])}</p>`:""}<p class="muted">${esc(ST.say||"")}</p></div>${standHtml()}`; }
  else if(ST.k==="game") h+=`<div class="panel">${head}<div class="qtext">${esc(ST.text)}</div><div class="bar" id="pBar"><i style="width:100%"></i></div></div>`;
  else if(ST.k==="gameres"){ const g=(ST.gres||{})[mt.id]; h+=`<div class="panel">${head}<h2>Resultat</h2>${g?`<p>Lagets snitt: <b>${g.avgScore}</b> (${g.n} spelare rapporterade)</p><div class="res ok">${"★".repeat(g.pts)}${"☆".repeat(3-g.pts)} +${g.pts}</div>`:"<p>Räknar ihop …</p>"}<p class="muted">Ditt resultat: ${game.sent>=0?game.sent:"–"}</p></div>${standHtml()}`; }
  else if(ST.k==="score") h+=`<div class="panel">${head}<h2>Ställningen</h2></div>${standHtml()}`;
  else if(ST.k==="end"){ const s=(ST.teams||[]).filter(t=>t.members.length).slice().sort((a,b)=>b.score-a.score); const win=s[0]&&mt&&s[0].id===mt.id;
    h+=`<div class="panel">${LOGO}<div class="res ${win?"ok":""}">${win?"NI VANN!":"SLUTRESULTAT"}</div><p style="text-align:center">${esc(s[0]?s[0].name:"")} är QuizChampions 2026!</p></div>${standHtml()}<div class="row"><button class="btn star" id="pGb">Efterfest: spela Guldboll</button></div>`; }
  v.innerHTML=h; bindView(); playerTicker(); }
function bindView(){ const o=$("pOut"); if(o) o.onclick=logout;
  const gb=$("pGb"); if(gb) gb.onclick=()=>{ $("gbFree").srcdoc=b64html(GBFREE_SRC); $("gbModal").hidden=false; document.body.classList.add("noscroll"); };
  const rb=$("pRenameBtn"); if(rb) rb.onclick=()=>{ const n=$("pRename").value.trim(); if(!n){ toast("Skriv ett lagnamn"); return; } send({t:"name",name:n}); $("pRename").blur(); toast("Lagnamnet sparat!"); setTimeout(renderPlayer,300); };
  const ri=$("pRename"); if(ri) ri.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); rb.click(); } };
  document.querySelectorAll("#pView .opt[data-o]").forEach(b=>b.onclick=()=>{ const o=+b.dataset.o, mt=myTeam(); if(!mt) return;
    const tv=(ST.votes[mt.id]=ST.votes[mt.id]||{}); if(tv[ME.pid]&&tv[ME.pid].o===o) delete tv[ME.pid]; else tv[ME.pid]={o,t:Date.now()};
    send({t:"vote",si:ST.si,opt:o}); renderPlayer(); }); }
function playerTicker(){ if(!ST) return; const bar=$("pBar"); if(bar && ST.deadline){ const tot=ST.deadline-ST.start, left=Math.max(0,ST.deadline-Date.now()); bar.firstChild.style.width=(tot>0?left/tot*100:0)+"%"; bar.classList.toggle("low",left<10000); }
  const c=$("pCount"); if(c && ST.deadline){ const left=ST.deadline-Date.now(); c.textContent= left>3000?"3":left>2000?"2":left>1000?"1":"KÖR!"; } }
function loginHtml(){ const g=parseCode(QS.get("g")||""); const last=LS.get("qc_lastname","");
  return `${installHtml()}<div class="panel">${LOGO}<h2>Logga in</h2><p>Skriv ditt namn. Du lottas sedan in i ett lag med 3–5 spelare.</p>
    <label class="lab" for="lName">Ditt namn</label><input class="input" id="lName" maxlength="16" autocomplete="off" autocapitalize="words" placeholder="T.ex. Joel" value="${esc(last)}">
    <label class="lab" for="lCode">Kod från storbildsskärmen</label><input class="input code" id="lCode" maxlength="6" autocomplete="off" placeholder="ABCD" value="${g?esc(g.code+(g.bi?"-"+(g.bi+1):"")):""}">
    <button class="btn primary" id="lGo">Gå med</button></div>`; }
function bindLogin(){ bindInstall(); const go=()=>{ const name=$("lName").value.replace(/\s+/g," ").trim().slice(0,16), c=parseCode($("lCode").value);
    if(!name){ toast("Skriv ditt namn"); $("lName").focus(); return; } if(!c){ toast("Koden har fyra tecken, t.ex. ABCD"); $("lCode").focus(); return; }
    const old=LS.get("qc_me",null); ME={pid:(old&&old.pid)||rid(12), name, code:c.code, bi:c.bi}; LS.set("qc_me",ME); LS.set("qc_lastname",name); playerConnect(); renderPlayer(); };
  $("lGo").onclick=go; $("lCode").onkeydown=e=>{ if(e.key==="Enter") go(); }; $("lName").onkeydown=e=>{ if(e.key==="Enter") $("lCode").focus(); }; }
function logout(){ if(PNET){ try{ PNET.end(true); }catch(e){} PNET=null; } const pid=ME&&ME.pid; ME=null; ST=null; LS.set("qc_me",null); if(pid) LS.set("qc_pidkeep",pid); renderPlayer(); }

/* ---------- installera som app ---------- */
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredInstall=e; const b=$("iBtn"); if(b) b.hidden=false; });
function installHtml(){ if(!document.querySelector('link[rel="manifest"]')) return ""; if(matchMedia("(display-mode: standalone)").matches || navigator.standalone===true) return "";
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  return `<div class="panel install" style="box-shadow:inset 0 0 0 3px var(--sun),6px 6px 0 #000"><h2>Installera appen</h2><p>${ios?"iPhone: öppna i <b>Safari</b>, tryck på <b>Dela</b> och välj <b>Lägg till på hemskärmen</b>.":"Android: tryck på <b>Installera</b>, eller välj <b>Installera app</b> i webbläsarens meny (⋮)."}</p><button class="btn primary" id="iBtn" ${deferredInstall?"":"hidden"}>Installera</button></div>`; }
function bindInstall(){ const b=$("iBtn"); if(b) b.onclick=async()=>{ if(!deferredInstall) return; deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(e){} deferredInstall=null; b.hidden=true; }; }

function initPlayer(){ $("player").hidden=false; if(document.querySelector('link[rel="manifest"]') && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  const g=parseCode(QS.get("g")||""); if(ME && g && (g.code!==ME.code || g.bi!==ME.bi)){ ME.code=g.code; ME.bi=g.bi; LS.set("qc_me",ME); }
  $("gbClose").onclick=()=>{ $("gbModal").hidden=true; $("gbFree").removeAttribute("srcdoc"); $("gbFree").src="about:blank"; document.body.classList.remove("noscroll"); };
  if(ME) playerConnect(); renderPlayer(); setInterval(playerTicker,200); }

if(isHost()) initHost(); else initPlayer();
</script>
</body></html>
